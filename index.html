<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          document.documentElement.setAttribute(
            'data-theme',
            t === 'dark' ? 'dark' : 'light'
          );
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <title>AMRAP With Friends — Live Group AMRAP Workout Timer</title>
    <meta
      name="description"
      content="AMRAP With Friends is a live group workout timer for As Many Rounds As Possible sessions. Host or join a session, stay on a synced countdown, and race the leaderboard together."
    />
    <link rel="canonical" href="https://amrapwithfriends.com/" />
    <meta property="og:title" content="AMRAP With Friends — Live Group AMRAP Workout Timer" />
    <meta
      property="og:description"
      content="AMRAP With Friends is a live group workout timer for As Many Rounds As Possible sessions. Host or join a session, stay on a synced countdown, and race the leaderboard together."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://amrapwithfriends.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="AMRAP With Friends — Live Group AMRAP Workout Timer" />
    <meta
      name="twitter:description"
      content="AMRAP With Friends is a live group workout timer for As Many Rounds As Possible sessions. Host or join a session, stay on a synced countdown, and race the leaderboard together."
    />
    <script type="application/ld+json">

        "@context": "https://schema.org",

        "name": "AMRAP With Friends",
        "description": "AMRAP With Friends is a live group workout timer for As Many Rounds As Possible sessions. Host or join a session, stay on a synced countdown, and race the leaderboard together.",
        "applicationCategory": "HealthApplication",

      }

  </head>
